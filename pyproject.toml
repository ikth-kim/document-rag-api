[project]
name = "document-rag-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hyung", email = "ikth.kim@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
]

[project.scripts]
document-rag-api = "document_rag_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
